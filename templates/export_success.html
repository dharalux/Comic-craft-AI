<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Export Complete
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">

    <div class="card success">

        <h1>
            ✅ Export Complete
        </h1>

        <p>
            Your ComicCraft PDF is ready.
        </p>


        {% if pdf_path %}

        <a
            class="button"
            href="/download?path={{ pdf_path }}"
        >
            Download PDF
        </a>

        {% endif %}


        <br><br>

        <a
            class="button"
            href="/"
        >
            Create Another Comic
        </a>

    </div>

</div>

</body>

</html>
